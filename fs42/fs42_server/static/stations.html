<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Station Manager - FieldStation42</title>
    <link rel="stylesheet" href="https://unpkg.com/purecss@3.0.0/build/pure-min.css">
    <link rel="stylesheet" href="https://unpkg.com/purecss@3.0.0/build/grids-responsive-min.css">
    <link rel="stylesheet" id="theme-css" href="/static/themes/default.css">
    <link rel="stylesheet" href="/static/station_ui.css">
</head>
<body>
    <script src="/static/common.js"></script>
    <script src="/static/fs42_client.js"></script>
    <script>
        let allStations = [];
        let filteredStations = [];
        let savingStationOrder = false;
        let deletingStation = false;

        // Initialize page layout
        document.addEventListener('DOMContentLoaded', async function() {
            window.fs42Common.initTheme();

            const content = `
                <div class="page-header">
                    <div>
                        <h1 style="margin:0;">Station Manager</h1>
                        <p style="color:#8b949e;margin:0.5em 0 0 0;">Manage your FieldStation42 channel configurations</p>
                    </div>
                    <button class="pure-button pure-button-primary" onclick="showTemplateSelector()">
                        + Create New Station
                    </button>
                </div>

                <div class="filter-bar">
                    <select id="type-filter" class="pure-input">
                        <option value="all">All Types</option>
                        <option value="standard">Standard</option>
                        <option value="web">Web</option>
                        <option value="guide">Guide</option>
                        <option value="loop">Loop</option>
                        <option value="streaming">Streaming</option>
                    </select>
                    <div class="search-container">
                        <input id="search-input" type="text" class="pure-input" placeholder="Search stations...">
                        <span class="search-icon">🔍</span>
                    </div>
                </div>

                <div class="channel-order-help">
                    Drag rows to reorder channels. Existing channel numbers are reassigned to match the new order and saved automatically. Clear filters to reorder the full lineup.
                </div>
                <div id="channel-order-status" class="channel-order-status" role="status" aria-live="polite"></div>

                <div id="station-list">
                    <div class="loading-spinner">
                        <p>Loading stations...</p>
                    </div>
                </div>

                <!-- Template Selector Modal -->
                <div id="template-modal" class="modal" style="display:none;">
                    <div class="modal-overlay" onclick="hideTemplateSelector()"></div>
                    <div class="modal-content">
                        <div class="modal-header">
                            <h2>Create New Station</h2>
                            <button class="modal-close" onclick="hideTemplateSelector()">×</button>
                        </div>
                        <div class="modal-body">
                            <p style="color:#8b949e;margin-bottom:1.5em;">Choose a template to get started:</p>
                            <div class="template-grid">
                                <div class="template-card" onclick="createFromTemplate('standard')">
                                    <div class="template-icon">📺</div>
                                    <h3>Standard</h3>
                                    <p>Traditional scheduled TV with time slots and programming</p>
                                </div>
                                <div class="template-card" onclick="createFromTemplate('web')">
                                    <div class="template-icon">🌐</div>
                                    <h3>Web Page</h3>
                                    <p>Embed a web page as a channel</p>
                                </div>
                                <div class="template-card" onclick="createFromTemplate('loop')">
                                    <div class="template-icon">🔄</div>
                                    <h3>Loop</h3>
                                    <p>Continuous playlist of content</p>
                                </div>
                                <div class="template-card" onclick="createFromTemplate('guide')">
                                    <div class="template-icon">📋</div>
                                    <h3>Guide</h3>
                                    <p>Scrolling guide with programming schedule</p>
                                </div>
                                <div class="template-card" onclick="createFromTemplate('streaming')">
                                    <div class="template-icon">📡</div>
                                    <h3>Streaming</h3>
                                    <p>External stream sources</p>
                                </div>
                                <div class="template-card" onclick="createFromTemplate('blank')">
                                    <div class="template-icon">⚡</div>
                                    <h3>Blank</h3>
                                    <p>Minimal configuration for advanced users</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.body.innerHTML = await window.fs42Common.createPageLayout('', content);

            // Load stations
            await loadStations();

            // Setup event listeners
            document.getElementById('type-filter').addEventListener('change', applyFilters);
            document.getElementById('search-input').addEventListener('input', applyFilters);
        });

        async function loadStations() {
            try {
                const data = await window.fs42Api.get('stations');
                // Extract station_conf from each station object
                allStations = (data.stations || [])
                    .map(s => s.station_conf)
                    .filter(station => station && typeof station === 'object');
                allStations.sort((a, b) => {
                    const aNumbered = isReorderableStation(a);
                    const bNumbered = isReorderableStation(b);
                    if (aNumbered !== bNumbered) return aNumbered ? -1 : 1;
                    return (Number(a.channel_number) || 0) - (Number(b.channel_number) || 0);
                });
                filteredStations = [...allStations];
                const status = document.getElementById('channel-order-status');
                if (status) status.textContent = '';

                renderStations();
            } catch (error) {
                document.getElementById('station-list').innerHTML = `
                    <div class="error-message">
                        <strong>Error loading stations:</strong> ${error.message || 'Unknown error'}
                    </div>
                `;
            }
        }

        function applyFilters() {
            const typeFilter = document.getElementById('type-filter').value;
            const searchQuery = document.getElementById('search-input').value.toLowerCase();

            filteredStations = allStations.filter(station => {
                // Type filter
                if (typeFilter !== 'all' && (station.network_type || 'standard') !== typeFilter) {
                    return false;
                }

                // Search filter
                if (searchQuery) {
                    const nameMatch = (station.network_name || '').toLowerCase().includes(searchQuery);
                    const channelMatch = String(station.channel_number || '').includes(searchQuery);
                    if (!nameMatch && !channelMatch) {
                        return false;
                    }
                }

                return true;
            });

            renderStations();
        }

        function renderStations() {
            const container = document.getElementById('station-list');

            if (filteredStations.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No stations found</h3>
                        <p>Try adjusting your filters or search query.</p>
                    </div>
                `;
                return;
            }

            const canReorder = !savingStationOrder
                && !deletingStation
                && document.getElementById('type-filter').value === 'all'
                && !document.getElementById('search-input').value.trim();
            let html = '<div class="station-order-list">';

            for (const station of filteredStations) {
                const name = escapeHtml(station.network_name || 'Unnamed Station');
                const channel = station.channel_number || 'N/A';
                const type = station.network_type || 'standard';
                const safeType = /^[a-z0-9_-]+$/i.test(type) ? type : 'standard';
                const description = getStationDescription(station);
                const stationIndex = allStations.indexOf(station);
                const draggable = canReorder && isReorderableStation(station);
                const dragAttributes = draggable ? 'draggable="true" data-draggable="true"' : '';
                const draftBadge = station._draft
                    ? '<span class="station-card-draft">draft &bull; not on air</span>'
                    : '';
                const lockIcon = station.parental_controls
                    ? `<span class="station-card-lock" title="PIN protected" aria-label="PIN protected">
                           <svg viewBox="0 0 24 24" width="0.8em" height="0.8em" fill="currentColor" aria-hidden="true">
                               <path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 0 1 6 0v3H9z"/>
                           </svg>
                       </span>`
                    : '';
                const draftReason = station._draft
                    ? `<div class="station-card-draft-reason">${escapeHtml(station._draft_reason || 'Configuration could not be loaded')}</div>`
                    : '';

                html += `
                    <div class="station-order-row${draggable ? ' is-draggable' : ''}" data-station-index="${stationIndex}" ${dragAttributes}>
                        <span class="station-drag-handle" aria-hidden="true">${draggable ? '⠿' : ''}</span>
                        <span class="station-order-channel">#${escapeHtml(String(channel))}</span>
                        <div class="station-order-details">
                            <div class="station-order-heading">
                                <h3>${name}${lockIcon}</h3>
                                <span class="station-card-type station-type-${safeType}">${escapeHtml(type)}</span>
                                ${draftBadge}
                            </div>
                            <div class="station-order-description">${description}</div>
                            ${draftReason}
                        </div>
                        <div class="station-order-actions">
                            <button class="pure-button pure-button-primary" data-name="${encodeURIComponent(station.network_name || '')}" onclick="editStation(decodeURIComponent(this.dataset.name))">
                                <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align: -0.125em">
                                    <path d="M4 20l4.5-1 12-12a2.1 2.1 0 0 0-3-3l-12 12L4 20zm11-13 3 3"/>
                                </svg>
                                Edit Config
                            </button>
                            <button class="pure-button" data-name="${encodeURIComponent(station.network_name || '')}" onclick="duplicateStation(decodeURIComponent(this.dataset.name))">
                                <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align: -0.125em">
                                    <rect x="8" y="8" width="12" height="12" rx="2"/>
                                    <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>
                                </svg>
                                Duplicate
                            </button>
                            <button type="button" class="pure-button sv-danger" data-name="${encodeURIComponent(station.network_name || '')}" onclick="deleteStation(decodeURIComponent(this.dataset.name))" ${!station.network_name || savingStationOrder || deletingStation ? 'disabled' : ''}>
                                <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align: -0.125em">
                                    <path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/>
                                </svg>
                                Delete
                            </button>
                        </div>
                    </div>
                `;
            }

            html += '</div>';
            container.innerHTML = html;
            if (canReorder) setupStationDragging(container);
        }

        function isReorderableStation(station) {
            return typeof station.network_name === 'string'
                && station.network_name.length > 0
                && Number.isInteger(station.channel_number);
        }

        function setupStationDragging(container) {
            let draggedRow = null;
            container.querySelectorAll('[data-draggable="true"]').forEach(row => {
                row.addEventListener('dragstart', event => {
                    draggedRow = row;
                    row.classList.add('is-dragging');
                    event.dataTransfer.effectAllowed = 'move';
                    event.dataTransfer.setData('text/plain', row.dataset.stationIndex);
                });
                row.addEventListener('dragend', () => {
                    row.classList.remove('is-dragging');
                    container.querySelectorAll('.is-drop-target').forEach(target => {
                        target.classList.remove('is-drop-target');
                    });
                    draggedRow = null;
                });
                row.addEventListener('dragover', event => {
                    if (!draggedRow || draggedRow === row) return;
                    event.preventDefault();
                    event.dataTransfer.dropEffect = 'move';
                    row.classList.add('is-drop-target');
                });
                row.addEventListener('dragleave', () => row.classList.remove('is-drop-target'));
                row.addEventListener('drop', async event => {
                    event.preventDefault();
                    row.classList.remove('is-drop-target');
                    const fromIndex = Number(event.dataTransfer.getData('text/plain'));
                    const toIndex = Number(row.dataset.stationIndex);
                    if (Number.isInteger(fromIndex) && Number.isInteger(toIndex) && fromIndex !== toIndex) {
                        await moveStation(fromIndex, toIndex);
                    }
                });
            });
        }

        async function moveStation(fromIndex, toIndex) {
            const ordered = allStations.filter(isReorderableStation);
            const from = ordered.findIndex(station => allStations.indexOf(station) === fromIndex);
            const to = ordered.findIndex(station => allStations.indexOf(station) === toIndex);
            if (from < 0 || to < 0) return;

            const [station] = ordered.splice(from, 1);
            ordered.splice(to, 0, station);
            const incomplete = allStations.filter(station => !isReorderableStation(station));
            allStations = [...ordered, ...incomplete];
            filteredStations = [...allStations];
            savingStationOrder = true;
            renderStations();

            const status = document.getElementById('channel-order-status');
            status.textContent = 'Saving channel order…';
            status.classList.remove('is-error');
            try {
                const result = await window.fs42Api.post('stations/reorder', {
                    network_names: ordered.map(station => station.network_name),
                });
                const assignments = new Map(
                    result.stations.map(station => [station.network_name, station.channel_number]),
                );
                allStations.forEach(station => {
                    if (assignments.has(station.network_name)) {
                        station.channel_number = assignments.get(station.network_name);
                    }
                });
                filteredStations = [...allStations];
                status.textContent = result.message || 'Channel order saved.';
            } catch (error) {
                const message = error.detail || error.message || 'Could not save channel order.';
                await loadStations();
                const status = document.getElementById('channel-order-status');
                status.textContent = message;
                status.classList.add('is-error');
            } finally {
                savingStationOrder = false;
                renderStations();
            }
        }

        function getStationDescription(station) {
            const type = station.network_type || 'standard';

            switch(type) {
                case 'standard':
                    const increment = station.schedule_increment || 30;
                    const commercial = station.commercial_free ? 'Commercial-free' : 'With commercials';
                    return `${commercial} &bull; ${increment}-min intervals`;

                case 'web':
                    const url = station.web_url || 'No URL set';
                    return `Web page channel<br><small title="${escapeHtml(url)}" style="color:#61afef;">${escapeHtml(url)}</small>`;

                case 'guide':
                    const messages = station.messages?.length || 0;
                    const images = station.images?.length || 0;
                    return `Program guide &bull; ${messages} message(s) &bull; ${images} image(s)`;

                case 'loop':
                    const dir = station.content_dir || 'No directory set';
                    return `Continuous loop<br><small style="color:#61afef;">${escapeHtml(dir)}</small>`;

                case 'streaming':
                    const streams = station.streams?.length || 0;
                    return `External streams &bull; ${streams} source(s)`;

                default:
                    return 'Custom configuration';
            }
        }

        function editStation(networkName) {
            window.location.href = `station_editor.html?station=${encodeURIComponent(networkName)}`;
        }

        async function deleteStation(networkName) {
            if (!networkName || savingStationOrder || deletingStation) return;
            if (!window.confirm(`Delete station "${networkName}"?`)) return;

            deletingStation = true;
            renderStations();
            try {
                await window.fs42Api.delete(`stations/${encodeURIComponent(networkName)}`);
                allStations = allStations.filter(station => station.network_name !== networkName);
            } catch (error) {
                window.alert(`Error deleting station: ${error.detail || error.message}`);
            } finally {
                deletingStation = false;
                applyFilters();
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Template selector modal functions
        function showTemplateSelector() {
            document.getElementById('template-modal').style.display = 'flex';
        }

        function hideTemplateSelector() {
            document.getElementById('template-modal').style.display = 'none';
        }

        async function createFromTemplate(templateName) {
            hideTemplateSelector();

            try {
                // Load the template
                const response = await fetch(`/static/templates/${templateName}.json`, { cache: 'no-cache' });
                if (!response.ok) {
                    throw new Error(`Failed to load template: ${response.statusText}`);
                }
                const template = await response.json();

                // Suggest next available channel number
                const channelNumber = await findNextAvailableChannel();
                template.station_conf.channel_number = channelNumber;
                const defaultName = `Channel${channelNumber}`;
                template.station_conf.network_name = allStations.some(s => s.network_name === defaultName)
                    ? generateDuplicateName(defaultName)
                    : defaultName;

                // Store template in sessionStorage and navigate to editor
                sessionStorage.setItem('newStationTemplate', JSON.stringify(template));
                window.location.href = 'station_editor.html?mode=create';

            } catch (error) {
                alert(`Error loading template: ${error.message}`);
            }
        }

        async function duplicateStation(networkName) {
            try {
                // Fetch the existing station
                const data = await window.fs42Api.get(`stations/${encodeURIComponent(networkName)}`);
                const config = data.station_config;
                const conf = config.station_conf;

                conf.network_name = generateCopyName(conf.network_name);
                conf.channel_number = await findNextAvailableChannel();

                // Store in sessionStorage and navigate to editor
                sessionStorage.setItem('newStationTemplate', JSON.stringify(config));
                window.location.href = 'station_editor.html?mode=create';

            } catch (error) {
                alert(`Error duplicating station: ${error.message}`);
            }
        }

        function generateCopyName(originalName) {
            const base = `${originalName}-Copy`;
            let name = base;
            let num = 2;
            while (allStations.some(s => s.network_name === name)) {
                name = `${base} ${num++}`;
            }
            return name;
        }

        function generateDuplicateName(originalName) {
            // Check if name already ends with " 2", " 3", etc.
            const match = originalName.match(/^(.*?)\s+(\d+)$/);

            if (match) {
                const baseName = match[1];
                let num = parseInt(match[2]);

                // Find next available number
                while (allStations.some(s => s.network_name === `${baseName} ${num}`)) {
                    num++;
                }
                return `${baseName} ${num}`;
            } else {
                // No number suffix, try " 2"
                if (!allStations.some(s => s.network_name === `${originalName} 2`)) {
                    return `${originalName} 2`;
                }

                // " 2" exists, find next available
                let num = 3;
                while (allStations.some(s => s.network_name === `${originalName} ${num}`)) {
                    num++;
                }
                return `${originalName} ${num}`;
            }
        }

        async function findNextAvailableChannel() {
            const usedChannels = allStations.map(s => s.channel_number);

            // Find first available channel starting from 1
            for (let i = 1; i < 1000; i++) {
                if (!usedChannels.includes(i)) {
                    return i;
                }
            }

            return 999; // Fallback
        }
    </script>
</body>
</html>

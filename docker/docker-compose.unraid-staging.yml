name: fieldstation42-hometv-staging

services:
  fieldstation42-hometv:
    build:
      context: "${FS42_APP_PATH:-/mnt/user/appdata/fieldstation42-hometv/app}"
      dockerfile: docker/Dockerfile.hometv
    image: fieldstation42-hometv:staging
    container_name: fieldstation42-hometv
    restart: unless-stopped
    init: true
    ports:
      - "4243:4242"
    environment:
      FS42_SERVER_HOST: "0.0.0.0"
      FS42_SERVER_PORT: "4242"
      FS42_DB_PATH: "/app/runtime/fs42_fluid.db"
      FS42_HLS_DIR: "/app/runtime/hls"
      FS42_LOG_DIR: "/app/logs"
      FS42_HEADLESS: "1"
      FS42_HLS_IDLE_SECONDS: "${FS42_HLS_IDLE_SECONDS:-90}"
      FS42_HLS_MAX_SESSIONS: "${FS42_HLS_MAX_SESSIONS:-8}"
      HOMETV_INITIAL_BUFFER_SECONDS: "${HOMETV_INITIAL_BUFFER_SECONDS:-6}"
      TZ: "${TZ:-America/Chicago}"
    volumes:
      - "/mnt/user/Media:/media:ro"
      - "/mnt/user/appdata/fieldstation42-hometv/confs:/app/confs"
      - "/mnt/user/appdata/fieldstation42-hometv/catalog:/app/catalog"
      - "/mnt/user/appdata/fieldstation42-hometv/runtime:/app/runtime"
      - "/mnt/user/appdata/fieldstation42-hometv/runtime/logs:/app/logs"
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:4242/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      com.fieldstation42.deployment: "unraid-staging"
      com.fieldstation42.repository: "/mnt/user/appdata/fieldstation42-hometv/app"
    security_opt:
      - no-new-privileges:true
